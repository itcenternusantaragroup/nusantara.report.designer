[package]
name = "nusantara_report_designer"
version = "1.0.1"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
eframe = { version = "0.30", default-features = false, features = ["default", "glow"] }
egui = "0.30"
image = { version = "0.25", default-features = false, features = ["png", "webp", "jpeg"] }
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
uuid = { version = "1.10", features = ["v4", "fast-rng"] }
printpdf = { version = "0.7", features = ["embedded_images"] }
ttf-parser = "0.19"

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png", "webp", "ico"] }
