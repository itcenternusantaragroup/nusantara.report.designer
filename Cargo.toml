[package]
name = "nusantara_report_designer"
version = "1.0.1"
edition = "2024"

[dependencies]
eframe = { version = "0.30", default-features = false, features = ["default", "glow"] }
egui = "0.30"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
uuid = { version = "1.10", features = ["v4", "fast-rng"] }

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
